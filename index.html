<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD com Firebase - Tela Dividida</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="dashboard-container">
        
   
        <div class="card-form">
            <h2>Gerenciar Pessoa</h2>
            
            <!-- ID oculto para edição -->
            <input type="hidden" id="person-id">

            <div class="input-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite o nome">
            </div>

            <div class="input-group">
                <label for="idade">Idade</label>
                <input type="number" id="idade" placeholder="Digite a idade">
            </div>
            
            <button id="btn-submit">Salvar</button>
        </div>

   
        <div class="card-table">
            <h2>Pessoas Cadastradas</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="person-list">
                        <!-- Os dados do Firebase entram aqui dinamicamente -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Script do Firebase -->
    <script type="module" src="crud.js"></script>
</body>
</html>
